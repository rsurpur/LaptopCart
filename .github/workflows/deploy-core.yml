name: Build and Deploy LaptopCart

on:
  push:
    branches:
      - master   # change to 'main' if your repo default branch is main
  workflow_dispatch:

jobs:
  build-and-deploy-core:
    runs-on: windows-latest
    permissions:
      id-token: write   # required for OIDC login to Azure
      contents: read    # allows checkout of code
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # change to 9.x only if project targets it

      - name: Restore dependencies
        run: dotnet restore ./LaptopCart/LaptopCart.csproj

      - name: Build project
        run: dotnet build ./LaptopCart/LaptopCart.csproj --configuration Release --no-restore

      # Optional: only if you have test projects
      # If no test projects exist, comment this step out
      - name: Run tests
        run: dotnet test ./LaptopCart/LaptopCart.csproj --no-build --verbosity normal

      - name: Publish project
        run: dotnet publish ./LaptopCart/LaptopCart.csproj -c Release -o ./publish-web

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LaptopCartCoreRG'   # must match App Service name in Azure
          slot-name: 'production'
          package: ./publish-web
