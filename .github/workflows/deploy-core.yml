name: Build and Deploy LaptopCart Core

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # change to 9.x only if project targets it

      - name: Restore dependencies
        run: dotnet restore ./LaptopCartCore

      - name: Build project
        run: dotnet build ./LaptopCartCore --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./LaptopCartCore --no-build --verbosity normal

      - name: Publish project
        run: dotnet publish ./LaptopCartCore -c Release -o ./publish-web

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LaptopCartCoreRG'   # must match App Service name in Azure
          slot-name: 'production'
          package: ./publish-web
