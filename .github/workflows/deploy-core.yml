name: Build and Deploy LaptopCart (Core + API)

on:
  push:
    branches:
      - master   # LaptopCart repo default branch
  workflow_dispatch:

jobs:
  build-and-deploy-core:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: rsurpur/LaptopCart
          ref: master
          path: LaptopCart

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Core
        run: dotnet restore ./LaptopCart/LaptopCart/LaptopCart.csproj

      - name: Build Core
        run: dotnet build ./LaptopCart/LaptopCart/LaptopCart.csproj --configuration Release --no-restore

      - name: Publish Core
        run: dotnet publish ./LaptopCart/LaptopCart/LaptopCart.csproj -c Release -o ./publish-core

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Core
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LaptopCartCoreRG'   # replace with your actual App Service name
          slot-name: 'production'
          package: ./publish-core

  build-and-deploy-api:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: rsurpur/LaptopCart.Api
          ref: main
          path: LaptopCart.Api

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore ./LaptopCart.Api/LaptopCart.Api/LaptopCart.Api.csproj

      - name: Build API
        run: dotnet build ./LaptopCart.Api/LaptopCart.Api/LaptopCart.Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ./LaptopCart.Api/LaptopCart.Api/LaptopCart.Api.csproj -c Release -o ./publish-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LaptopCartApiRG'   # replace with your actual App Service name
          slot-name: 'production'
          package: ./publish-api
